name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        id: proj
        run: |
          find . -maxdepth 4 -not -path './.git*' | sort | head -80
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle 파일이 없습니다. StockAlertApp 폴더 안의 파일을 모두 업로드하세요."
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" StockAlert-v1.${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAlert-apk
          path: StockAlert-v1.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: StockAlert v1.${{ github.run_number }}
          body: Download the .apk file below and install it on your phone.
          files: StockAlert-v1.${{ github.run_number }}.apk
