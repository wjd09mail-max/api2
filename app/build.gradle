plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stockalert'
    compileSdk 35

    defaultConfig {
        applicationId "com.stockalert"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "2.2.1"
    }

    // 고정 서명키: 새 버전을 기존 앱 위에 그대로 업데이트 설치할 수 있게 함
    signingConfigs {
        fixed {
            storeFile file('stockalert.keystore')
            storePassword 'stockalert'
            keyAlias 'stockalert'
            keyPassword 'stockalert'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
